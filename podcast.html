<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Podcast - AE MUSA</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --preto: #1D1B17;
            --branco: #F7ECE2;
            --azul: #1D81C7;
        }

        body {
            background-color: var(--azul);
            font-family: 'Inter', sans-serif;
            padding-top: 80px;
        }

        .header-title {
            text-transform: uppercase;
            font-weight: bold;
        }

        .box-shadow {
            box-shadow: 5px 5px 0 var(--preto);
        }

        .bg-branco {
            background-color: var(--branco);
        }

        .logo-fixed {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 1040;
            width: 60px;
            height: 60px;
            background-color: var(--branco);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
        }
    </style>
</head>

<body>

<div class="logo-fixed">
    <img src="logo.jpeg" class="logo-img">
</div>

<nav class="navbar navbar-expand-lg navbar-light fixed-top bg-light">
    <div class="container">
        <a class="navbar-brand" href="index.html">AE MUSA</a>
    </div>
</nav>

<section class="bg-branco py-5 text-center">
    <h1 class="header-title">Podcast AE MUSA</h1>
    <p>Ouve os nossos episódios mais recentes 🎙️</p>
</section>

<section class="container my-5">
    <div class="bg-branco p-4 box-shadow text-center">

        <h3 class="mb-4">Spotify</h3>

        <iframe style="border-radius:12px" 
            src="https://open.spotify.com/embed/show/5Bco3YTuXsKDVZJleArz2h" 
            width="100%" 
            height="352" 
            frameBorder="0" 
            allowfullscreen="" 
            allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture">
        </iframe>

        <p class="mt-4">
            <a href="https://open.spotify.com/show/5Bco3YTuXsKDVZJleArz2h" target="_blank">
                Abrir no Spotify
            </a>
        </p>

    </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
